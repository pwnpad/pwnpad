---
- name: Install openbox window manager
  hosts: lima-pwnpad-builder
  tags: setup_openbox
  gather_facts: false
  tasks:
    - name: Install packages
      become: true
      community.general.pacman:
        name:
          - gnu-free-fonts
          - novnc
          - openbox
          - pipewire
          - pipewire-jack
          - pipewire-pulse
          - wireplumber
          - x11vnc
          - xorg-server-xvfb
        update_cache: yes

    - name: Copy systemd services
      become: true
      vars:
        pwnpad_vm_user: "pwnpad"
      ansible.builtin.copy:
        src: ../../config/systemd/
        dest: /home/{{ pwnpad_vm_user }}/.config/systemd
        owner: "{{ pwnpad_vm_user }}"
        group: users
        mode: "0644"

    - name: Set default PipeWire volume to 100%
      become: true
      ansible.builtin.copy:
        src: ../../config/wireplumber/
        dest: /etc/wireplumber/wireplumber.conf.d/
        mode: "0644"

    - name: Add user to audio group
      become: true
      ansible.builtin.user:
        name: pwnpad
        groups: audio
        append: yes

    - name: Enable linger for user 'pwnpad'
      become: true
      command: loginctl enable-linger pwnpad

    - name: Reload systemd daemon for user services
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Enable and start user services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        scope: user
      loop:
        - xvfb
        - openbox
        - pipewire.socket
        - pipewire-pulse.socket
        - wireplumber
        - x11vnc
        - novnc

- name: Build virtio_snd kernel module via DKMS
  hosts: lima-pwnpad-builder
  tags: setup_virtio_snd
  gather_facts: true
  tasks:
    - name: Install kernel headers
      become: true
      ansible.builtin.package:
        name: "{{ 'linux-aarch64-headers' if ansible_facts['architecture'] == 'aarch64' else 'linux-headers' }}"
        state: present

    - name: Install DKMS
      become: true
      community.general.pacman:
        name: dkms
        state: present

    - name: Get upstream kernel version
      become: false
      ansible.builtin.shell: uname -r | cut -d. -f1,2
      register: upstream_ver
      changed_when: false

    - name: Create DKMS source directory
      become: true
      ansible.builtin.file:
        path: /usr/src/virtio_snd-1.0
        state: directory
        mode: "0755"

    - name: Download virtio_snd source files
      become: true
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/torvalds/linux/refs/tags/v{{ upstream_ver.stdout }}/sound/virtio/{{ item }}"
        dest: "/usr/src/virtio_snd-1.0/{{ item }}"
        mode: "0644"
      loop:
        - virtio_card.c
        - virtio_card.h
        - virtio_chmap.c
        - virtio_ctl_msg.c
        - virtio_ctl_msg.h
        - virtio_jack.c
        - virtio_kctl.c
        - virtio_pcm.c
        - virtio_pcm.h
        - virtio_pcm_msg.c
        - virtio_pcm_ops.c

    - name: Generate Kbuild
      become: true
      ansible.builtin.copy:
        dest: /usr/src/virtio_snd-1.0/Kbuild
        content: |
          obj-m += virtio_snd.o
          virtio_snd-y := virtio_card.o virtio_chmap.o virtio_ctl_msg.o virtio_jack.o virtio_kctl.o virtio_pcm.o virtio_pcm_msg.o virtio_pcm_ops.o
        mode: "0644"

    - name: Generate dkms.conf
      become: true
      ansible.builtin.copy:
        dest: /usr/src/virtio_snd-1.0/dkms.conf
        content: |
          PACKAGE_NAME="virtio_snd"
          PACKAGE_VERSION="1.0"
          BUILT_MODULE_NAME[0]="virtio_snd"
          DEST_MODULE_LOCATION[0]="/kernel/sound/virtio"
          MAKE[0]="make -C /lib/modules/${kernelver}/build M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
          AUTOINSTALL="yes"
        mode: "0644"

    - name: Register and install with DKMS
      become: true
      ansible.builtin.shell: |
        dkms remove virtio_snd/1.0 --all 2>/dev/null || true
        dkms add virtio_snd/1.0
        dkms install virtio_snd/1.0

    - name: Load module on boot
      become: true
      ansible.builtin.copy:
        dest: /etc/modules-load.d/virtio_snd.conf
        content: virtio_snd
