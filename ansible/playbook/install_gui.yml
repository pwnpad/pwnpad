---
- name: Install openbox window manager
  hosts: lima-pwnpad-builder
  tags: setup_openbox
  gather_facts: false
  tasks:
    - name: Install packages
      become: true
      community.general.pacman:
        name:
          - gnu-free-fonts
          - novnc
          - openbox
          - pipewire
          - pipewire-jack
          - pipewire-pulse
          - wireplumber
          - x11vnc
          - xorg-server-xvfb
        update_cache: yes

    - name: Copy systemd services
      become: true
      vars:
        pwnpad_vm_user: "pwnpad"
      ansible.builtin.copy:
        src: ../../config/systemd/
        dest: /home/{{ pwnpad_vm_user }}/.config/systemd
        owner: "{{ pwnpad_vm_user }}"
        group: users
        mode: "0644"

    - name: Set default PipeWire volume to 100%
      become: true
      ansible.builtin.copy:
        src: ../../config/wireplumber/
        dest: /etc/wireplumber/main.lua.d/
        mode: "0644"

    - name: Add user to audio group
      become: true
      ansible.builtin.user:
        name: pwnpad
        groups: audio
        append: yes

    - name: Enable linger for user 'pwnpad'
      become: true
      command: loginctl enable-linger pwnpad

    - name: Reload systemd daemon for user services
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Enable and start user services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        scope: user
      loop:
        - xvfb
        - openbox
        - pipewire.socket
        - pipewire-pulse.socket
        - wireplumber
        - x11vnc
        - novnc

- name: Build virtio_snd kernel module via DKMS
  hosts: lima-pwnpad-builder
  tags: setup_virtio_snd
  gather_facts: true
  tasks:
    - name: Install kernel headers
      become: true
      ansible.builtin.package:
        name: "{{ 'linux-aarch64-headers' if ansible_facts['architecture'] == 'aarch64' else 'linux-headers' }}"
        state: present

    - name: Install DKMS
      become: true
      community.general.pacman:
        name: dkms
        state: present

    - name: Copy virtio_snd source for DKMS
      become: true
      ansible.builtin.copy:
        src: ../../config/dkms/virtio_snd/
        dest: /usr/src/virtio_snd-1.0/
        mode: "0644"

    - name: Register and install with DKMS
      become: true
      ansible.builtin.shell: |
        dkms remove virtio_snd/1.0 --all 2>/dev/null || true
        dkms add virtio_snd/1.0
        dkms install virtio_snd/1.0

    - name: Load module on boot
      become: true
      ansible.builtin.copy:
        dest: /etc/modules-load.d/virtio_snd.conf
        content: virtio_snd
