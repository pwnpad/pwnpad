---
- name: Install openbox window manager
  hosts: lima-pwnpad-builder
  tags: setup_openbox
  gather_facts: false
  tasks:
    - name: Install packages
      become: true
      community.general.pacman:
        name:
          - gnu-free-fonts
          - novnc
          - openbox
          - pipewire
          - pipewire-jack
          - pipewire-pulse
          - wireplumber
          - x11vnc
          - xorg-server-xvfb
        update_cache: yes

    - name: Copy systemd services
      become: true
      vars:
        pwnpad_vm_user: "pwnpad"
      ansible.builtin.copy:
        src: ../../config/systemd/
        dest: /home/{{ pwnpad_vm_user }}/.config/systemd
        owner: "{{ pwnpad_vm_user }}"
        group: users
        mode: "0644"

    - name: Set default PipeWire volume to 100%
      become: true
      ansible.builtin.copy:
        src: ../../config/wireplumber/
        dest: /etc/wireplumber/main.lua.d/
        mode: "0644"

    - name: Add user to audio group
      become: true
      ansible.builtin.user:
        name: pwnpad
        groups: audio
        append: yes

    - name: Enable linger for user 'pwnpad'
      become: true
      command: loginctl enable-linger pwnpad

    - name: Reload systemd daemon for user services
      ansible.builtin.systemd:
        daemon_reload: true
        scope: user

    - name: Enable and start user services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        scope: user
      loop:
        - xvfb
        - openbox
        - pipewire.socket
        - pipewire-pulse.socket
        - wireplumber
        - x11vnc
        - novnc

- name: Build virtio_snd kernel module
  hosts: lima-pwnpad-builder
  tags: setup_virtio_snd
  gather_facts: true
  tasks:
    - name: Check if virtio_snd is already available
      ansible.builtin.shell: |
        modinfo virtio_snd 2>/dev/null && echo "exists" || echo "missing"
      register: virtio_snd_check
      changed_when: false

    - name: Install kernel headers
      when: virtio_snd_check.stdout != "exists"
      become: true
      ansible.builtin.package:
        name: "{{ 'linux-aarch64-headers' if ansible_facts['architecture'] == 'aarch64' else 'linux-headers' }}"
        state: present

    - name: Find kernel version with available headers
      when: virtio_snd_check.stdout != "exists"
      become: true
      ansible.builtin.shell: |
        set -e
        for kv in /lib/modules/*/build; do
          echo "${kv%/*}"
        done | sort -V | tail -1 | xargs basename
      register: target_kernel

    - name: Fail if no kernel headers found
      when:
        - virtio_snd_check.stdout != "exists"
        - target_kernel.stdout is not defined or target_kernel.stdout == ""
      fail:
        msg: "No kernel build directories found in /lib/modules/"

    - name: Build and install virtio_snd module
      when:
        - virtio_snd_check.stdout != "exists"
        - target_kernel.stdout is defined
      become: true
      block:
        - name: Get upstream kernel version
          ansible.builtin.shell:
            cmd: echo "{{ target_kernel.stdout }}" | sed 's/-.*//'
          register: upstream_ver

        - name: Download kernel source
          ansible.builtin.get_url:
            url: "https://cdn.kernel.org/pub/linux/kernel/v{{ upstream_ver.stdout | regex_replace('^(\\d+).*', '\\1') }}.x/linux-{{ upstream_ver.stdout }}.tar.xz"
            dest: "/tmp/linux-{{ upstream_ver.stdout }}.tar.xz"
            timeout: 120

        - name: Extract virtio sound driver source
          ansible.builtin.unarchive:
            src: "/tmp/linux-{{ upstream_ver.stdout }}.tar.xz"
            dest: /tmp
            extra_opts:
              - "linux-{{ upstream_ver.stdout }}/sound/virtio"
            remote_src: yes

        - name: Create Kbuild file
          ansible.builtin.copy:
            dest: "/tmp/linux-{{ upstream_ver.stdout }}/sound/virtio/Kbuild"
            content: |
              obj-m += virtio_snd.o
              virtio_snd-y := virtio_card.o virtio_chmap.o virtio_ctl_msg.o virtio_jack.o virtio_kctl.o virtio_pcm.o virtio_pcm_msg.o virtio_pcm_ops.o

        - name: Build the module
          ansible.builtin.shell: |
            make -C "/lib/modules/{{ target_kernel.stdout }}/build" \
                 M="/tmp/linux-{{ upstream_ver.stdout }}/sound/virtio" \
                 modules

        - name: Install the module
          ansible.builtin.shell: |
            KERNEL="{{ target_kernel.stdout }}"
            UPSTREAM="{{ upstream_ver.stdout }}"
            mkdir -p "/lib/modules/$KERNEL/kernel/sound/virtio"
            cp "/tmp/linux-$UPSTREAM/sound/virtio/virtio_snd.ko" "/lib/modules/$KERNEL/kernel/sound/virtio/"
            depmod -a "$KERNEL"

        - name: Load module on boot
          ansible.builtin.copy:
            dest: /etc/modules-load.d/virtio_snd.conf
            content: |
              virtio_snd
